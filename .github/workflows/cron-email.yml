name: Enviar Reporte Diario de Reservas

on:
  schedule:
    # 07:00 a 20:30 ART (10:00 a 23:30 UTC) -> Lunes a Viernes
    - cron: '0,30 10-23 * * 1-5'
    # 21:00 ART (00:00 UTC del día siguiente) -> Martes a Sábado UTC
    - cron: '0,30 0 * * 2-6'
  workflow_dispatch:

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: |
          npm install firebase-admin nodemailer @firebase/app

      - name: Run script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node enviar-resumen.js
