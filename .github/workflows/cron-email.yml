name: Enviar Reporte Diario de Reservas

on:
  schedule:
    # GitHub usa UTC. Para correr a las 07:37 ART (UTC-3) de Lunes a Viernes:
    # 07:37 ART = 10:37 UTC
    - cron: '37 10 * * 1-5'
  workflow_dispatch:

jobs:
  enviar-reporte:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Show current time in UTC and ART
        run: |
          echo "UTC: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          echo "ART: $(TZ=America/Argentina/Buenos_Aires date '+%Y-%m-%d %H:%M:%S ART')"

      - name: Install dependencies
        run: |
          npm install firebase-admin nodemailer @firebase/app

      - name: Run script
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_DESTINATARIO: ${{ secrets.EMAIL_DESTINATARIO }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node enviar-resumen.js
